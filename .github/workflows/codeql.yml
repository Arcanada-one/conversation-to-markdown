# Advanced CodeQL on self-hosted runners.
# Matches measured default-setup (GET .../code-scanning/default-setup,
# 2026-11-17T08:27:08Z): languages actions + javascript-typescript
# (API also listed javascript/typescript aliases), query_suite=default,
# schedule=weekly. No fixed /tmp paths.
#
# Root must turn default setup off before this workflow can upload SARIF
# (GitHub refuses advanced uploads while default setup is configured),
# OR prefer the smaller Root-only change: point default setup at labeled
# self-hosted runners (runner_type=labeled, runner_label=ci-general).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 04:17 UTC — same cadence as default-setup schedule=weekly.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: [self-hosted, Linux, X64, ci-general]
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          # Omit `queries` → CodeQL default suite (measured query_suite=default).

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"
