<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversation to Markdown</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      padding: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo-icon {
      font-size: 24px;
      line-height: 1;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: #666;
      margin-top: 1px;
    }

    #btn-copy {
      width: 100%;
      padding: 11px 16px;
      background: #19c37d;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }

    #btn-copy:hover { background: #1ed88a; }
    #btn-copy:active { transform: scale(0.97); }
    #btn-copy:disabled { background: #333; color: #666; cursor: default; }

    /* A long conversation is a long job, not a failure — the operator decides
       when to stop it, so the control is always reachable while scanning. */
    #btn-cancel {
      width: 100%;
      margin-top: 8px;
      padding: 9px 16px;
      background: transparent;
      color: #999;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: none;
    }

    #btn-cancel:hover { color: #e05252; border-color: #e0525266; }
    #btn-cancel.visible { display: block; }

    #status {
      margin-top: 14px;
      font-size: 12px;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }

    #status.success {
      display: block;
      background: #0d2a1e;
      color: #19c37d;
      border: 1px solid #19c37d33;
    }

    #status.error {
      display: block;
      background: #2a0d0d;
      color: #e05252;
      border: 1px solid #e0525233;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
      color: #999;
      cursor: pointer;
      user-select: none;
    }

    .toggle input { accent-color: #19c37d; }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #444;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">📋</span>
    <div>
      <div class="logo-text">Conversation to Markdown</div>
      <div class="logo-sub">Copy conversation to clipboard</div>
    </div>
  </div>

  <button id="btn-copy">Copy as Markdown</button>
  <button id="btn-cancel">Stop scanning</button>

  <label class="toggle">
    <input type="checkbox" id="chk-images" />
    <span>Save .md + images to chatgpt-export/</span>
  </label>

  <div id="status"></div>

  <p class="hint">Open a ChatGPT conversation,<br>then click the button.</p>

  <script src="popup.js"></script>
</body>
</html>
